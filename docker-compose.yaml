version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bitacora_backend
    restart: always
    environment:
      - FLASK_ENV=production
      - DATABASE_PATH=/data/bitacora.db
      - UPLOAD_FOLDER=/data/uploads
      - TZ=America/Lima
    volumes:
      - bitacora_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health', timeout=5)"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 25s
    networks:
      - bitacora_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bitacora_frontend
    restart: always
    environment:
      - TZ=America/Lima
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - bitacora_net

volumes:
  bitacora_data:

networks:
  bitacora_net:
    driver: bridge
