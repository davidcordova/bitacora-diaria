server {
    listen 80;
    server_name bitacora.tuempresa.com; # Reemplazar con tu dominio o IP pública

    # Redirección opcional a HTTPS (activar una vez instalado el certificado SSL)
    # return 301 https://$host$request_uri;

    # Directorio de los archivos estáticos compilados de React (frontend/dist)
    root /var/www/bitacora/frontend/dist;
    index index.html;

    # Compresión Gzip para alto rendimiento
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Enrutamiento SPA (React / Vite)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy inverso hacia el API de Flask (Gunicorn)
    location /api/ {
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts para operaciones y reportes largos
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Cacheo de recursos estáticos inmutables (assets de Vite)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }
}
