name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  backend-checks:
    name: Backend Lint & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Run linter (pyflakes)
        run: |
          pyflakes backend/app.py backend/database.py backend/security.py backend/crypto_utils.py backend/seed_data.py backend/tests/*.py

      - name: Run test suite (pytest)
        env:
          BITACORA_DISABLE_SCHEDULER: '1'
        run: |
          cd backend
          python -m pytest tests -v

  frontend-checks:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck TypeScript
        working-directory: frontend
        run: npx tsc --noEmit -p .

      - name: Build frontend bundle
        working-directory: frontend
        run: npm run build
